name: Update closures on: schedule: [{cron: "0 */6 * * *"}] # every 6 hours (GitHub may delay runs by a few minutes) workflow_dispatch: permissions: {contents: write} jobs: update: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - uses: actions/setup-python@v5 with: {python-version: "3.12"} - run: python update_closures.py env: GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} - run: | git config user.name "closures-bot"; git config user.email "bot@users.noreply.github.com" git add closures.json; git diff --cached --quiet || (git commit -m "Update closures" && git push)